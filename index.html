<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>水瓶分類 PRO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #080c14; --bg-mid: #0e1525; --glass: rgba(255,255,255,0.05);
            --glass-b: rgba(255,255,255,0.12); --accent: #4f8ef7; --accent2: #c471ed;
            --gold: #f7c948; --danger: #ff4560; --success: #0be881;
            --text: #e8edf5; --text-dim: #6b7a99;
            --tube-w-d: 58px; --tube-h-d: 230px; --tube-w-m: 40px; --tube-h-m: 165px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'DM Sans', sans-serif; background: var(--bg-deep); color: var(--text);
            min-height: 100vh; display: flex; flex-direction: column; align-items: center;
            justify-content: center; overflow: hidden; position: relative;
        }
        body::before {
            content: ''; position: fixed; inset: 0;
            background: radial-gradient(ellipse 60% 50% at 20% 20%, rgba(79,142,247,0.12) 0%, transparent 70%),
                        radial-gradient(ellipse 50% 60% at 80% 80%, rgba(196,113,237,0.10) 0%, transparent 70%),
                        radial-gradient(ellipse 40% 40% at 50% 50%, rgba(11,232,129,0.04) 0%, transparent 70%);
            pointer-events: none; z-index: 0;
        }
        body > * { position: relative; z-index: 1; }

        #mute-btn, #music-btn {
            position: fixed; top: 14px; right: 14px; background: var(--glass);
            color: var(--text-dim); border: 1px solid var(--glass-b); border-radius: 40px;
            padding: 7px 14px; font-size: 0.8rem; font-family: 'DM Sans', sans-serif;
            font-weight: 500; cursor: pointer; backdrop-filter: blur(12px);
            transition: all 0.2s; z-index: 9999; letter-spacing: 0.5px;
        }
        #mute-btn:hover, #music-btn:hover { background: var(--glass-b); color: var(--text); }
        #music-btn { right: 104px; }

        #home-screen, #game-screen { display: flex; flex-direction: column; align-items: center; }
        #home-screen { width: 320px; max-width: 94vw; }
        #game-screen { display: none; width: 100%; min-height: 100vh; padding: 12px 10px; justify-content: center; }

        .home-logo { font-family: 'Syne', sans-serif; font-size: 2.4rem; font-weight: 800; letter-spacing: -1px; line-height: 1; margin-bottom: 4px; background: linear-gradient(135deg, #4f8ef7 0%, #c471ed 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .home-sub { font-size: 0.78rem; letter-spacing: 3px; text-transform: uppercase; color: var(--text-dim); margin-bottom: 32px; }
        .home-section-label { font-size: 0.72rem; letter-spacing: 2.5px; text-transform: uppercase; color: var(--text-dim); margin-bottom: 10px; align-self: flex-start; }

        .diff-row { display: flex; gap: 8px; width: 100%; margin-bottom: 22px; }
        .diff-pill {
            flex: 1; padding: 10px 6px; border-radius: 10px; border: 1.5px solid var(--glass-b);
            background: var(--glass); color: var(--text-dim); font-family: 'DM Sans', sans-serif;
            font-weight: 700; font-size: 0.82rem; cursor: pointer; transition: all 0.2s;
            text-align: center; backdrop-filter: blur(8px);
        }
        .diff-pill:hover { border-color: var(--accent); color: var(--text); }
        .diff-pill.active { background: linear-gradient(135deg, rgba(79,142,247,0.25), rgba(196,113,237,0.2)); border-color: var(--accent); color: #fff; box-shadow: 0 0 14px rgba(79,142,247,0.3); }
        .diff-pill .diff-icon { display: block; font-size: 1.2rem; margin-bottom: 3px; }
        .diff-pill .diff-label { display: block; font-size: 0.7rem; color: inherit; }

        .mode-grid { display: flex; flex-direction: column; gap: 8px; width: 100%; margin-bottom: 28px; }
        .mode-btn {
            width: 100%; padding: 13px 18px; border-radius: 12px; border: 1.5px solid transparent;
            font-family: 'DM Sans', sans-serif; font-weight: 700; font-size: 0.95rem; cursor: pointer;
            display: flex; align-items: center; gap: 10px; transition: all 0.25s cubic-bezier(0.4,0,0.2,1);
            position: relative; overflow: hidden;
        }
        .mode-btn::after { content: '›'; position: absolute; right: 16px; font-size: 1.4rem; opacity: 0.5; transition: transform 0.2s; }
        .mode-btn:hover::after { transform: translateX(4px); opacity: 1; }
        .mode-btn:active { transform: scale(0.98); }
        .mode-btn .mode-desc { font-size: 0.72rem; font-weight: 400; opacity: 0.7; display: block; margin-top: 1px; }
        .mode-btn .mode-title { font-size: 0.95rem; }
        .btn-stopwatch { background: linear-gradient(135deg, #1a2a4a, #1e3052); border-color: rgba(79,142,247,0.4); color: #7eb8ff; }
        .btn-stopwatch:hover { background: linear-gradient(135deg, #1e3052, #233860); border-color: var(--accent); box-shadow: 0 0 20px rgba(79,142,247,0.2); }
        .btn-countdown { background: linear-gradient(135deg, #2a1a1a, #381a1a); border-color: rgba(255,69,96,0.4); color: #ff7f93; }
        .btn-countdown:hover { background: linear-gradient(135deg, #381a1a, #4a1e1e); border-color: var(--danger); box-shadow: 0 0 20px rgba(255,69,96,0.2); }
        .btn-normal { background: linear-gradient(135deg, #0f2a1e, #0e2f1f); border-color: rgba(11,232,129,0.35); color: #6fffc4; }
        .btn-normal:hover { background: linear-gradient(135deg, #0e2f1f, #103825); border-color: var(--success); box-shadow: 0 0 20px rgba(11,232,129,0.15); }

        .top-bar { display: flex; align-items: center; justify-content: space-between; width: 100%; max-width: 860px; margin-bottom: 10px; padding: 0 4px; }
        .logo-small { font-family: 'Syne', sans-serif; font-size: 1.1rem; font-weight: 800; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -0.5px; }
        .top-actions { display: flex; gap: 7px; }
        .action-btn {
            background: var(--glass); color: var(--text-dim); border: 1px solid var(--glass-b);
            border-radius: 8px; padding: 6px 12px; font-family: 'DM Sans', sans-serif;
            font-size: 0.8rem; font-weight: 500; cursor: pointer; transition: all 0.2s;
            backdrop-filter: blur(8px); display: flex; align-items: center; gap: 5px;
        }
        .action-btn:hover { background: var(--glass-b); color: var(--text); transform: translateY(-1px); }
        .action-btn:active { transform: translateY(0); }
        .action-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }

        .stats-row { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
        .stat-chip {
            background: var(--glass); border: 1px solid var(--glass-b); border-radius: 8px;
            padding: 5px 14px; font-family: monospace; font-size: 1rem; font-weight: bold;
            color: var(--gold); backdrop-filter: blur(8px); min-width: 70px; text-align: center;
        }
        .stat-chip.danger { color: var(--danger); border-color: rgba(255,69,96,0.3); }
        .stat-chip.success { color: var(--success); border-color: rgba(11,232,129,0.3); }

        .progress-wrap { width: 100%; max-width: 500px; margin-bottom: 8px; }
        .progress-label { font-size: 0.7rem; color: var(--text-dim); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 4px; display: flex; justify-content: space-between; }
        .progress-bar { height: 4px; background: var(--glass-b); border-radius: 99px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 99px; transition: width 0.5s cubic-bezier(0.4,0,0.2,1); box-shadow: 0 0 8px rgba(79,142,247,0.5); }

        #message { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 1rem; text-align: center; letter-spacing: 0.5px; min-height: 24px; margin-bottom: 8px; transition: all 0.3s; }

        #game-board { display: flex; flex-wrap: wrap; justify-content: center; max-width: 860px; gap: 14px; padding: 8px; }

        .tube {
            width: var(--tube-w-d); height: var(--tube-h-d); background: rgba(255,255,255,0.02);
            border: 2.5px solid rgba(255,255,255,0.15); border-top: none; display: flex;
            flex-direction: column-reverse; cursor: pointer; border-radius: 0 0 28px 28px;
            box-shadow: inset 0 0 12px rgba(0,0,0,0.6), 0 8px 24px rgba(0,0,0,0.4);
            padding: 2px; position: relative; transition: transform 0.35s cubic-bezier(0.4,0,0.2,1), box-shadow 0.3s, border-color 0.2s; z-index: 1;
        }
        .tube::after {
            content: ''; position: absolute; top: 3%; left: 8%; width: 22%; height: 92%;
            background: linear-gradient(to bottom, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0) 60%);
            border-radius: 8px; pointer-events: none; z-index: 10;
        }
        .tube-cap {
            position: absolute; top: -10px; left: -3px; right: -3px; height: 10px;
            border-radius: 4px 4px 0 0; border: 2.5px solid rgba(255,255,255,0.15);
            border-bottom: none; background: rgba(255,255,255,0.04); z-index: 5;
        }
        .tube.selected { border-color: rgba(255,255,255,0.7); transform: translateY(-22px) scale(1.04); z-index: 50; box-shadow: inset 0 0 12px rgba(0,0,0,0.4), 0 20px 40px rgba(0,0,0,0.5), 0 0 0 2px rgba(255,255,255,0.3), 0 0 25px rgba(255,255,255,0.1); }
        .tube.hint-source { border-color: var(--gold); box-shadow: inset 0 0 12px rgba(0,0,0,0.4), 0 0 18px rgba(247,201,72,0.5); animation: pulse-gold 1s infinite alternate; }
        .tube.hint-target { border-color: var(--success); box-shadow: inset 0 0 12px rgba(0,0,0,0.4), 0 0 18px rgba(11,232,129,0.4); animation: pulse-green 1s infinite alternate; }
        .tube.complete { border-color: rgba(11,232,129,0.5); cursor: default; opacity: 0.85; }
        .tube.shake { animation: shake 0.35s ease; border-color: var(--danger); }
        .tube:focus-visible { outline: 3px solid var(--gold); outline-offset: 4px; }
        /* 地獄模式的上鎖管：只能倒出、不能倒入（8 秒後自動解鎖）。
           視覺上要一眼看得出來，否則玩家只會覺得「這管不能倒」很奇怪。 */
        .tube.frozen { border-color: rgba(120, 200, 255, 0.85); box-shadow: inset 0 0 18px rgba(120, 200, 255, 0.35), 0 0 14px rgba(120, 200, 255, 0.25); }
        .tube.frozen::before {
            content: '❄ 上鎖';
            position: absolute; top: -18px; left: 50%; transform: translateX(-50%);
            font-size: 0.62rem; font-weight: bold; white-space: nowrap;
            color: #bfe6ff; background: rgba(18, 40, 66, 0.9);
            border: 1px solid rgba(120, 200, 255, 0.6); border-radius: 999px; padding: 1px 6px;
        }

        @keyframes pulse-gold { from { box-shadow: inset 0 0 12px rgba(0,0,0,0.4), 0 0 12px rgba(247,201,72,0.4); } to { box-shadow: inset 0 0 12px rgba(0,0,0,0.4), 0 0 28px rgba(247,201,72,0.8); } }
        @keyframes pulse-green { from { box-shadow: inset 0 0 12px rgba(0,0,0,0.4), 0 0 10px rgba(11,232,129,0.3); } to { box-shadow: inset 0 0 12px rgba(0,0,0,0.4), 0 0 24px rgba(11,232,129,0.7); } }
        @keyframes shake { 0%,100% { transform: translateX(0) rotate(0); } 20% { transform: translateX(-5px) rotate(-2deg); } 40% { transform: translateX(5px) rotate(2deg); } 60% { transform: translateX(-4px) rotate(-1.5deg); } 80% { transform: translateX(4px) rotate(1.5deg); } }

        .liquid { width: 100%; height: 25%; transition: background-color 0.3s; position: relative; border-radius: 3px; }
        .liquid:nth-child(2) { border-bottom-left-radius: 29px; border-bottom-right-radius: 29px; }
        .liquid::before { content: ''; position: absolute; top: 0; left: 2px; right: 2px; height: 2.5px; background: rgba(255,255,255,0.35); border-radius: 50%; }

        /* 15 色在色相環均勻分佈、亮度交錯，小色塊也能一眼區分 */
        .color-1 { background: linear-gradient(180deg, #ff7b8a, #e8314a); }   /* 紅 */
        .color-2 { background: linear-gradient(180deg, #7ab8ff, #1e7de8); }   /* 藍 */
        .color-3 { background: linear-gradient(180deg, #7bf0a2, #28c95e); }   /* 綠 */
        .color-4 { background: linear-gradient(180deg, #ffe07a, #ffaa00); }   /* 黃 */
        .color-5 { background: linear-gradient(180deg, #b8a8ff, #7c5ce8); }   /* 紫 */
        .color-6 { background: linear-gradient(180deg, #ff9f5a, #f05e10); }   /* 橘 */
        .color-7 { background: linear-gradient(180deg, #6ee4f0, #0a9cc0); }   /* 青 */
        .color-8 { background: linear-gradient(180deg, #ff9fd6, #e0358a); }   /* 桃紅 */
        .color-9 { background: linear-gradient(180deg, #d8f07a, #96b810); }   /* 萊姆 */
        .color-10 { background: linear-gradient(180deg, #d0a078, #8a5530); }  /* 棕 */
        .color-11 { background: linear-gradient(180deg, #f4f7fa, #bcc9d8); }  /* 白 */
        .color-12 { background: linear-gradient(180deg, #34e8c4, #08a880); }  /* 藍綠 */
        .color-13 { background: linear-gradient(180deg, #c46a80, #801f38); }  /* 酒紅 */
        .color-14 { background: linear-gradient(180deg, #8894e8, #3040b0); }  /* 靛藍 */
        .color-15 { background: linear-gradient(180deg, #7a8088, #353b42); }  /* 深灰 */

        /* 色盲符號模式：可見色塊疊上形狀（顏色不再是唯一資訊） */
        #game-board.symbols .liquid:not(.color-hidden)::after {
            content: attr(data-sym);
            position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
            font-size: 1rem; font-weight: bold; color: rgba(0,0,0,0.55); text-shadow: 0 1px 0 rgba(255,255,255,0.35);
        }
        /* 下層顏色「露出來」的短高亮（盲眼模式的重要回饋） */
        @keyframes reveal-pop { 0% { filter: brightness(2.2); } 100% { filter: brightness(1); } }
        .liquid.revealed { animation: reveal-pop 0.7s ease; }
        @media (prefers-reduced-motion: reduce) { .liquid.revealed { animation: none; } }
        .color-hidden { background: #1e2540; position: relative; box-shadow: inset 0 0 10px rgba(0,0,0,0.5); }
        .color-hidden::before { display: none; }
        .color-hidden::after { content: '?'; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; font-weight: bold; color: rgba(255,255,255,0.4); }

        #win-overlay, #lose-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(12px); z-index: 500; align-items: center; justify-content: center; }
        #win-overlay.show, #lose-overlay.show { display: flex; }
        .win-card, .lose-card { background: linear-gradient(135deg, rgba(14,21,37,0.95), rgba(10,15,28,0.95)); border: 1px solid rgba(11,232,129,0.3); border-radius: 24px; padding: 40px 50px; text-align: center; box-shadow: 0 0 60px rgba(11,232,129,0.15), 0 30px 60px rgba(0,0,0,0.6); max-width: 360px; width: 90%; animation: win-pop 0.5s cubic-bezier(0.34,1.56,0.64,1) forwards; }
        .lose-card { background: linear-gradient(135deg, rgba(20,8,10,0.95), rgba(15,5,8,0.95)); border-color: rgba(255,69,96,0.3); box-shadow: 0 0 60px rgba(255,69,96,0.1), 0 30px 60px rgba(0,0,0,0.6); max-width: 340px; }
        @keyframes win-pop { from { transform: scale(0.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .win-emoji { font-size: 3.5rem; margin-bottom: 8px; }
        .win-title { font-family: 'Syne', sans-serif; font-size: 2rem; font-weight: 800; color: var(--success); margin-bottom: 8px; }
        .lose-title { font-family: 'Syne', sans-serif; font-size: 1.8rem; font-weight: 800; color: var(--danger); margin: 12px 0 8px; }
        .win-subtitle, .lose-sub { color: var(--text-dim); font-size: 0.9rem; margin-bottom: 20px; }
        .lose-sub { font-size: 0.88rem; margin-bottom: 22px; }
        .win-time { font-family: monospace; font-size: 1.8rem; color: var(--gold); font-weight: bold; margin-bottom: 24px; }
        .win-btns { display: flex; gap: 10px; justify-content: center; }
        .win-btn { padding: 11px 22px; border-radius: 10px; border: none; font-family: 'DM Sans', sans-serif; font-weight: 700; font-size: 0.9rem; cursor: pointer; transition: all 0.2s; }
        .win-btn-play { background: linear-gradient(135deg, var(--success), #00a86b); color: #000; }
        .win-btn-home { background: var(--glass-b); color: var(--text); border: 1px solid var(--glass-b); }
        .win-btn:hover { transform: translateY(-2px); filter: brightness(1.1); }
        .win-btn:active { transform: translateY(0); }

        .confetti { position: fixed; width: 9px; height: 12px; animation: cf-fall linear forwards; z-index: 999; border-radius: 2px; pointer-events: none; }
        @keyframes cf-fall { 0% { transform: translateY(-20px) rotate(0deg); opacity: 1; } 100% { transform: translateY(105vh) rotate(800deg); opacity: 0; } }

        @media (max-width: 600px) {
            :root { --tube-w-d: 40px; --tube-h-d: 165px; }
            #game-board { gap: 8px; }
            .win-card, .lose-card { padding: 28px 24px; }
            .win-title { font-size: 1.6rem; }
            .stats-row { gap: 7px; }
            .stat-chip { font-size: 0.88rem; padding: 4px 11px; }
            .top-bar { margin-bottom: 6px; }
            .action-btn { padding: 5px 9px; font-size: 0.75rem; }
        }
    </style>

<body>
    <button id="music-btn">🎵 音樂</button>
    <button id="mute-btn">🔊 音效</button>

    <div id="home-screen">
        <div class="home-logo">水瓶分類</div>
        <div class="home-sub">Color Sort · Blind Mode</div>

        <div class="home-section-label">難度</div>
        <div class="diff-row">
            <div class="diff-pill active" data-diff="6"><span class="diff-icon">🌱</span><span class="diff-label">簡單<br>6色</span></div>
            <div class="diff-pill" data-diff="8"><span class="diff-icon">🔥</span><span class="diff-label">中等<br>8色</span></div>
            <div class="diff-pill" data-diff="10"><span class="diff-icon">💀</span><span class="diff-label">困難<br>10色</span></div>
            <div class="diff-pill" data-diff="12"><span class="diff-icon">👹</span><span class="diff-label">地獄<br>12色</span></div>
        </div>

        <button id="resume-btn" class="mode-btn btn-normal" style="display:none;width:100%;margin-bottom:10px;">
            <span>▶</span><span><span class="mode-title">繼續上一局</span><span class="mode-desc" id="resume-desc"></span></span>
        </button>

        <button id="daily-btn" class="mode-btn btn-countdown" style="width:100%;margin-bottom:10px;">
            <span>📅</span><span><span class="mode-title">每日挑戰</span><span class="mode-desc" id="daily-desc">每天同一題，8 色</span></span>
        </button>

        <div class="home-section-label">模式</div>
        <div class="mode-grid">
            <button class="mode-btn btn-stopwatch" data-mode="stopwatch"><span>⏱</span><span><span class="mode-title">計時挑戰</span><span class="mode-desc">看看你要多久才能完成</span></span></button>
            <button class="mode-btn btn-countdown" data-mode="countdown"><span>⏳</span><span><span class="mode-title">90 秒限時</span><span class="mode-desc">時間不等人，全力衝！</span></span></button>
            <button class="mode-btn btn-normal" data-mode="normal"><span>☕</span><span><span class="mode-title">輕鬆模式</span><span class="mode-desc">無時間限制，慢慢解</span></span></button>
        </div>

        <div class="home-section-label">設定</div>
        <div class="diff-row">
            <div class="diff-pill" id="symbols-pill" style="cursor:pointer;flex:1;"><span class="diff-icon">🎨</span><span class="diff-label">色盲<br>符號</span></div>
            <div class="diff-pill active" id="assist-pill" style="cursor:pointer;flex:1;"><span class="diff-icon">🧭</span><span class="diff-label">輔助<br>全開</span></div>
        </div>

        <div class="home-section-label">最好成績</div>
        <div id="best-scores" style="width:100%;display:flex;flex-direction:column;gap:6px;margin-bottom:8px;"></div>
    </div>

    <div id="game-screen">
        <div class="top-bar">
            <span class="logo-small">Color Sort PRO</span>
            <div class="top-actions">
                <button class="action-btn" id="undo-btn" disabled>↩ 撤銷</button>
                <button class="action-btn" id="hint-btn">💡 提示</button>
                <button class="action-btn" id="peek-btn" title="3 秒內顯示所有顏色（每局 1 次）">🔍 透視</button>
                <button class="action-btn" id="reset-btn">🔄 重置</button>
                <button class="action-btn" id="home-btn">🏠</button>
            </div>
        </div>

        <div class="stats-row">
            <div class="stat-chip" id="timer-display">00:00</div>
            <div class="stat-chip" id="moves-display">0 步</div>
            <div class="stat-chip" id="par-display" title="求解器算出的最佳步數（12 色為近似值）">最佳 –</div>
        </div>

        <div class="progress-wrap">
            <div class="progress-label"><span>完成進度</span><span id="progress-text">0 / 0</span></div>
            <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
        </div>

        <div id="message" role="status" aria-live="polite"></div>
        <div id="game-board" role="group" aria-label="分類水瓶"></div>
    </div>

    <div id="win-overlay">
        <div class="win-card">
            <div class="win-emoji">🎉</div>
            <div class="win-title">過 關！</div>
            <div class="win-subtitle" id="win-subtitle">漂亮地完成了所有分類</div>
            <div class="win-time" id="win-stats"></div>
            <div class="win-btns">
                <button class="win-btn win-btn-play" id="next-btn">下一關 ›</button>
                <button class="win-btn win-btn-share" id="share-btn">📋 分享成績</button>
                <button class="win-btn win-btn-home" id="win-home-btn">主選單</button>
            </div>
        </div>
    </div>

    <div id="lose-overlay">
        <div class="lose-card">
            <div class="win-emoji">💀</div>
            <div class="lose-title">時間到！</div>
            <div class="lose-sub">差一點就完成了，再試一次？</div>
            <div class="win-btns">
                <button class="win-btn win-btn-play" id="retry-btn">再試一次</button>
                <button class="win-btn win-btn-home" id="lose-home-btn">主選單</button>
            </div>
        </div>
    </div>

<script src="game-core.js"></script>
<script>
(function() {
    // 純邏輯（合法移動、倒水、勝負、關卡產生、求解器）都在 game-core.js，
    // 同一份程式碼由 test-core.mjs 在 Node 驗證（舊版的產生器有不可解的後備路徑）。
    const Core = window.SortingWaterCore;
    const TUBE_CAPACITY = Core.TUBE_CAPACITY;
    const COUNTDOWN_SECONDS = 90, LS_KEYS = {
        mute: 'sw_muted', music: 'sw_music', diff: 'sw_diff',
        best: 'sw_best',              // 舊版：時間（數字），載入時遷移進 bestV2
        bestV2: 'sw_best_v2',         // { "6_stopwatch": { time, moves, stars, par } }
        save: 'sw_save',              // 進行中的盤面（可續玩）
        symbols: 'sw_symbols',        // 色盲符號模式
        assist: 'sw_assist',          // 輔助全開（無限提示／撤銷）
        daily: 'sw_daily',            // 每日挑戰紀錄 { "2026-09-17": { moves, time, stars } }
    };
    const DAILY_DIFFICULTY = 8, PEEK_MS = 3000, PEEK_PER_GAME = 1;
    const REWARD_EVERY = 3, REWARD_MAX = 2;   // 每完成 3 管給 1 個空管，每局最多 2 次
    const LOCK_MS = 8000;                     // 地獄模式：上鎖管幾毫秒後自動解鎖（用時間，不用步數）
    const HELL_EMPTY = 2;                     // 地獄模式（12 色）開局只給 2 個空管（預設 3）
    const HINT_NODE_BUDGET = 60000, MAX_VOICES = 10;
    let tubes = [], tubesSnapshot = [], movesApplied = [], selectedTubeIndex = null,
        parSteps = 0, parOptimal = false, symbolsOn = false, assistOn = true,
        dailyMode = false, dailyKey = '', peekLeft = PEEK_PER_GAME, peekUntil = 0,
        rewardGiven = 0, lockedTube = -1, lockUntil = 0, lockTimer = null, pendingLevel = null,
        prevCompleted = 0, lastPourInfo = null,
        isGameOver = false, isAnimating = false, timerInterval = null, currentTime = 0,
        clockBase = 0, clockStartAt = 0,   // wall-clock：避免 setInterval 漂移與背景節流
        gameMode = 'stopwatch', currentDifficulty = 6, moveCount = 0, hintTimeout = null, hintActive = false,
        audioCtx = null, isMuted = false;

    const $ = id => document.getElementById(id);

    let masterGain = null, activeVoices = 0;

    function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (!masterGain && audioCtx) {
            // 舊版每個音都直接連到 destination：勝利音效（6 音）疊上背景音樂與其他
            // 音效時會在同一瞬間塞進十幾個振盪器，容易削波。改由一顆 master gain 匯流。
            masterGain = audioCtx.createGain();
            masterGain.gain.value = 0.9;
            masterGain.connect(audioCtx.destination);
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function toggleMute() {
        isMuted = !isMuted;
        const btn = $('mute-btn');
        btn.textContent = isMuted ? '🔇 靜音' : '🔊 音效';
        btn.style.color = isMuted ? 'var(--danger)' : '';
        localStorage.setItem(LS_KEYS.mute, isMuted);
        if (!isMuted) initAudio();
    }

    function playTone(freq, type, dur, vol = 0.04) {
        if (isMuted || !audioCtx || !masterGain) return;
        // 同時發聲上限：琶音 + 快速連點時避免堆出幾十個振盪器
        if (activeVoices >= MAX_VOICES) return;
        const osc = audioCtx.createOscillator(), gain = audioCtx.createGain(), t = audioCtx.currentTime;
        osc.type = type; osc.frequency.value = freq;
        // 15ms attack 避免爆音
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.linearRampToValueAtTime(vol, t + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
        osc.connect(gain); gain.connect(masterGain);
        activeVoices++;
        osc.onended = () => {
            activeVoices = Math.max(0, activeVoices - 1);
            try { osc.disconnect(); gain.disconnect(); } catch (err) { /* 已斷線 */ }
        };
        osc.start(t); osc.stop(t + dur);
    }

    const SFX = {
        click: () => playTone(700, 'sine', 0.08, 0.04),
        select: () => playTone(900, 'sine', 0.12, 0.04),
        deselect: () => playTone(500, 'sine', 0.08, 0.03),
        error: () => { playTone(140, 'sawtooth', 0.1, 0.06); playTone(110, 'sawtooth', 0.15, 0.05); },
        // 倒了幾顆就響幾聲，音高依「來源管的水位」決定（低水位 → 低音），
        // 讓耳朵也能聽出「這管快空了」。原本是固定 5 聲隨機音高，跟畫面無關。
        pour: (drops = 1, level = 0.5) => {
            const base = 240 + level * 320;
            for (let i = 0; i < Math.max(1, drops); i++) {
                setTimeout(() => playTone(base + i * 60, 'sine', 0.18, 0.04), i * 90);
            }
        },
        complete: () => { [392, 494, 587].forEach((f, i) => setTimeout(() => playTone(f, 'sine', 0.5, 0.07), i * 120)); },
        win: () => { [261.63, 329.63, 392, 523.25, 659.25, 784].forEach((f, i) => setTimeout(() => playTone(f, 'sine', 0.5, 0.09), i * 130)); },
        tick: () => playTone(440, 'square', 0.05, 0.02),
    };

    // 背景音樂：程序化 lo-fi 琶音（Am–F–C–G），零音檔
    let musicOn = false, musicTimer = null, musicStep = 0;
    const CHORDS = [
        { b: 110.00, n: [220.00, 261.63, 329.63, 440.00] },  // Am
        { b: 87.31,  n: [174.61, 220.00, 261.63, 349.23] },  // F
        { b: 130.81, n: [261.63, 329.63, 392.00, 523.25] },  // C
        { b: 98.00,  n: [196.00, 246.94, 293.66, 392.00] },  // G
    ];

    function musicTick() {
        if (isMuted || !audioCtx) return;
        musicStep++;
        const ch = CHORDS[Math.floor(musicStep / 16) % CHORDS.length];
        if (musicStep % 16 === 1) playTone(ch.b, 'triangle', 2.5, 0.035);
        if (Math.random() < 0.55) {
            const f = ch.n[Math.floor(Math.random() * ch.n.length)] * (Math.random() < 0.25 ? 2 : 1);
            playTone(f, 'sine', 1.4, 0.016);
        }
    }

    function startMusic() {
        if (musicTimer || !musicOn) return;
        initAudio();
        musicStep = 0;
        musicTimer = setInterval(musicTick, 300);
    }

    function stopMusic() { clearInterval(musicTimer); musicTimer = null; }

    function toggleMusic() {
        musicOn = !musicOn;
        const btn = $('music-btn');
        btn.textContent = musicOn ? '🎵 音樂' : '🎵 關閉';
        btn.style.color = musicOn ? '' : 'var(--danger)';
        localStorage.setItem(LS_KEYS.music, musicOn);
        if (musicOn) startMusic(); else stopMusic();
    }

    document.body.addEventListener('click', () => { initAudio(); if (musicOn) startMusic(); }, { once: true });

    // 背景分頁不需要持續排琶音：隱藏時停掉，回到前景再續（音樂設定不變）
    document.addEventListener('visibilitychange', () => {
        if (document.hidden) stopMusic();
        else {
            if (musicOn && !isMuted) startMusic();
            tickTimer();   // 回到前景立刻校正計時（背景期間分頁被節流）
        }
    });

    const deepClone = Core.clone;
    const getValidMoves = Core.getValidMoves;

    // 關卡產生：反向倒水 + 有上限的「消除相鄰同色」微調 + 求解器驗證
    // （舊版的後備路徑是純隨機重分配，不保證可解，且是沒有上限的 while(true)）
    function generateRandomLevel(difficulty) {
        // 地獄模式開局更緊：空管從 3 降為 2（生成器仍會用求解器驗證可解）
        const opts = difficulty >= 12 ? { numEmpty: HELL_EMPTY } : undefined;
        return Core.generateLevel(difficulty, Math.random, opts);
    }

    function countCompleted() { return tubes.filter(t => t.length === TUBE_CAPACITY && t.every(c => c === t[0])).length; }

    function updateProgress() {
        const completed = countCompleted(), target = currentDifficulty,
              pct = target > 0 ? completed / target * 100 : 0;
        $('progress-fill').style.width = pct + '%';
        $('progress-text').textContent = `${completed} / ${target}`;
    }

    const reduceMotion = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };

    /** 管子的無障礙描述：「第 2 管：可見 2 顆藍色，另有 2 顆未知」（盲眼模式）。 */
    const isCompleteTube = (tube) => Core.isCompleteTube(tube);
    const tubeEl = (index) => $('game-board').children[index] || null;
    let lastHiddenCount = [];   // 每管上一次遮住幾層（用來判斷「有顏色露出來」）

    /** 觸覺回饋（震動）；尊重 prefers-reduced-motion。 */
    function buzz(ms) {
        if (reduceMotion.matches || !navigator.vibrate) return;
        try { navigator.vibrate(ms); } catch (err) { /* 有些瀏覽器會擋，忽略 */ }
    }

    /** 管子的無障礙描述：「第 2 管：可見 2 顆，另有 2 顆未知」（盲眼模式）。 */
    function describeTube(tubeContent, index) {
        if (tubeContent.length === 0) return `第 ${index + 1} 管：空管`;
        const topColor = tubeContent[tubeContent.length - 1];
        let hideFromIndex = -1;
        for (let i = tubeContent.length - 1; i >= 0; i--) {
            if (tubeContent[i] !== topColor) { hideFromIndex = i; break; }
        }
        const visible = tubeContent.length - 1 - hideFromIndex;
        if (isCompleteTube(tubeContent)) return `第 ${index + 1} 管：已完成`;
        if (index === lockedTube) return `第 ${index + 1} 管：上鎖中（只能倒出、不能倒入）`;
        const hidden = hideFromIndex + 1;
        return `第 ${index + 1} 管：可見 ${visible} 顆，另有 ${hidden} 顆未知`;
    }

    function renderBoard() {
        const board = $('game-board');
        // 管子元素只建立一次，之後只更新內容與狀態 —— 舊版每次點擊都整塊重建，
        // 除了多餘的 DOM 成本，鍵盤焦點也會在重建時被丟掉。
        if (board.children.length !== tubes.length) {
            board.innerHTML = '';
            tubes.forEach((_, index) => {
                const tubeDiv = document.createElement('div');
                tubeDiv.className = 'tube';
                tubeDiv.dataset.index = String(index);
                tubeDiv.tabIndex = 0;
                tubeDiv.setAttribute('role', 'button');
                const cap = document.createElement('div');
                cap.className = 'tube-cap';
                tubeDiv.appendChild(cap);
                board.appendChild(tubeDiv);
            });
        }

        tubes.forEach((tubeContent, index) => {
            const tubeDiv = board.children[index];
            tubeDiv.classList.toggle('selected', selectedTubeIndex === index);
            tubeDiv.classList.toggle('complete', isCompleteTube(tubeContent));
            tubeDiv.classList.toggle('frozen', index === lockedTube);
            tubeDiv.setAttribute('aria-pressed', selectedTubeIndex === index ? 'true' : 'false');
            tubeDiv.setAttribute('aria-label', describeTube(tubeContent, index));

            // 判斷頂部色塊邏輯：初始演算法盡量避免相鄰同色，因此起手下方多半顯示問號
            const topColor = tubeContent.length > 0 ? tubeContent[tubeContent.length - 1] : null;
            let hideFromIndex = -1;
            for (let i = tubeContent.length - 1; i >= 0; i--) {
                if (tubeContent[i] !== topColor) { hideFromIndex = i; break; }
            }
            for (let i = tubeDiv.children.length - 1; i >= 1; i--) tubeDiv.removeChild(tubeDiv.children[i]);
            // 透視中（peekUntil 內）暫時不做盲眼遮蔽
            const reveal = Date.now() < peekUntil;
            // 這一管之前遮住幾層？變少代表有顏色「露出來」了 → 給一個短高亮當回饋
            const prevHidden = lastHiddenCount[index] == null ? hideFromIndex + 1 : lastHiddenCount[index];
            lastHiddenCount[index] = hideFromIndex + 1;
            const revealed = !reveal && hideFromIndex + 1 < prevHidden;
            tubeContent.forEach((color, i) => {
                const liq = document.createElement('div');
                const isHidden = !reveal && i <= hideFromIndex;
                liq.className = 'liquid' + (isHidden ? ' color-hidden' : ' color-' + color)
                    + (revealed && !isHidden && i <= prevHidden - 1 ? ' revealed' : '');
                // 色盲符號模式靠這個屬性顯示形狀（顏色不再是唯一資訊）
                liq.dataset.sym = Core.COLOR_SYMBOLS[(color - 1) % Core.COLOR_SYMBOLS.length];
                tubeDiv.appendChild(liq);
            });
        });
    }

    function handleTubeClick(index) {
        if (isGameOver || isAnimating) return;
        if (!tubes[index]) return;   // 盤面剛好被重建（例如獎勵空管、續玩還原）時的殘留點擊
        clearHintHighlights();
        hintActive = false;

        if (selectedTubeIndex === null) {
            if (tubes[index].length > 0) {
                const t = tubes[index];
                if (t.length === TUBE_CAPACITY && t.every(c => c === t[0])) return;
                SFX.select(); buzz(8);
                selectedTubeIndex = index;
                renderBoard();
            } else {
                triggerShake(index);
            }
        } else if (selectedTubeIndex === index) {
            SFX.deselect();
            selectedTubeIndex = null;
            renderBoard();
        } else {
            if (canPour(selectedTubeIndex, index)) {
                isAnimating = true;
                movesApplied.push([selectedTubeIndex, index]);
                $('undo-btn').disabled = false;
                moveCount++;
                animatePour(selectedTubeIndex, index, () => {
                    executePour(selectedTubeIndex, index);
                    selectedTubeIndex = null;
                    isAnimating = false;
                    renderBoard();
                    updateProgress();
                    saveProgress();
                    if (isDeadEnd() && !checkWinCondition()) $('message').textContent = '😵 沒有可用的移動了，試試撤銷！';
                    else checkWinCondition();
                });
            } else if (tubes[index].length > 0 && !(tubes[index].length === TUBE_CAPACITY && tubes[index].every(c => c === tubes[index][0]))) {
                // 不能倒但目標非空且未完成 → 直接改選該管，省一次點擊
                SFX.select();
                selectedTubeIndex = index;
                renderBoard();
            } else {
                triggerShake(index);
            }
        }
    }

    const canPour = (sourceIdx, targetIdx) => {
        // 上鎖管（地獄模式）只能倒出、不能倒入；時間到或完成任一管就解鎖
        if (targetIdx === lockedTube) return false;
        return Core.canPour(tubes, sourceIdx, targetIdx);
    };

    function unlockTube(reason) {
        if (lockedTube < 0) return;
        lockedTube = -1; lockUntil = 0;
        clearTimeout(lockTimer); lockTimer = null;
        $('message').textContent = reason || '🔓 上鎖管已解鎖';
        renderBoard();
    }

    function scheduleUnlock() {
        clearTimeout(lockTimer);
        const ms = Math.max(0, lockUntil - Date.now());
        lockTimer = setTimeout(() => unlockTube('🔓 時間到，上鎖管自動解鎖'), ms + 20);
    }

    function executePour(sourceIdx, targetIdx) {
        // 倒幾顆的規則只有一份（Core.pourCount）：頂部同色連續數與目標剩餘空間取小
        const count = Core.pourCount(tubes, sourceIdx, targetIdx);
        const src = tubes[sourceIdx], tgt = tubes[targetIdx];
        const level = src.length ? src.length / TUBE_CAPACITY : 0;
        lastPourInfo = { drops: count, level };   // 測試用：音效參數與實際倒的數量是否一致
        SFX.pour(count, level);
        for (let i = 0; i < count; i++) tgt.push(src.pop());
        $('moves-display').textContent = moveCount + ' 步';
        afterMoveBookkeeping();
    }

    /**
     * 每一步之後的盤面事件：
     *   - 完成任一管 → 凍結全部解凍（地獄模式的節奏：先跨過一道門檻就鬆綁）
     *   - 每完成 REWARD_EVERY 管（上限 REWARD_MAX 次）→ 獎勵一個空管
     * 空管是「附加在尾端」，因此步數日誌重放（撤銷／續玩）仍然有效。
     */
    function afterMoveBookkeeping() {
        const completed = countCompleted();
        if (completed > prevCompleted) buzz(18);
        prevCompleted = completed;
        if (completed > 0 && lockedTube >= 0) unlockTube('🔓 完成一管，上鎖管解鎖！');
        const earned = Math.floor(completed / REWARD_EVERY);
        while (earned > rewardGiven && rewardGiven < REWARD_MAX) {
            rewardGiven++;
            tubes.push([]);
            tubesSnapshot.push([]);
            renderBoard();
            $('message').textContent = `🎁 完成 ${completed} 管，獲得額外空管！`;
        }
    }

    function isDeadEnd() { return Core.isDeadEnd(tubes); }

    function animatePour(sourceIdx, targetIdx, callback) {
        const srcEl = tubeEl(sourceIdx), tgtEl = tubeEl(targetIdx);
        if (!srcEl || !tgtEl || reduceMotion.matches) { callback(); return; }
        const sRect = srcEl.getBoundingClientRect(), tRect = tgtEl.getBoundingClientRect();
        const dx = tRect.left - sRect.left, dy = tRect.top - sRect.top - 25,
              rotateDeg = dx >= 0 ? 72 : -72, offsetX = dx >= 0 ? -sRect.width / 2 : sRect.width / 2;
        srcEl.style.zIndex = '200';
        srcEl.style.transformOrigin = 'top center';
        srcEl.style.transition = 'transform 0.38s cubic-bezier(0.4,0,0.2,1)';
        srcEl.style.transform = `translate(${dx + offsetX}px,${dy}px) rotate(${rotateDeg}deg)`;
        const cleanup = () => { srcEl.style.transform = ''; srcEl.style.transition = ''; srcEl.style.zIndex = ''; };
        setTimeout(() => { cleanup(); callback(); }, 400);
    }

    function triggerShake(index) {
        SFX.error(); buzz(28);
        const el = tubeEl(index);
        if (!el) return;
        el.classList.add('shake');
        setTimeout(() => el.classList.remove('shake'), 350);
    }

    function showHint() {
        SFX.click();
        clearHintHighlights();
        if (hintActive) { hintActive = false; return; }
        if (!assistOn && hintLeft <= 0) {
            $('message').textContent = '提示次數用完（可在首頁開啟輔助模式）';
            return;
        }
        if (!assistOn) { hintLeft--; updateAssistLabels(); }
        // 用求解器算出「真的走得完」的下一步，而不是貪心猜一步（舊版常把人帶進死局）。
        // 有節點預算，找不到解就退回合法移動的第一個。
        const solution = Core.solve(tubes, { maxNodes: HINT_NODE_BUDGET }).moves;
        let best = solution && solution.length ? solution[0] : null;
        let remaining = solution ? solution.length : 0;
        if (best && best[1] === lockedTube) {
            const alt = getValidMoves(tubes).find(([f, t]) => t !== lockedTube);
            best = alt ? [alt[0], alt[1]] : null;
            remaining = 0;
        }
        if (!best) {
            const moves = getValidMoves(tubes);
            if (!moves.length) { $('message').textContent = '😵 沒有可用移動，試試撤銷！'; return; }
            best = [moves[0][0], moves[0][1]];
        }
        const [from, to] = best;
        if (remaining > 0) $('message').textContent = `💡 建議這一步（還需約 ${remaining} 步）`;
        else $('message').textContent = '💡 找不到完整解，先試這個移動';
        const fromEl = tubeEl(from), toEl = tubeEl(to);
        if (!fromEl || !toEl) return;
        fromEl.classList.add('hint-source');
        toEl.classList.add('hint-target');
        hintActive = true;
        clearTimeout(hintTimeout);
        hintTimeout = setTimeout(() => { clearHintHighlights(); hintActive = false; }, 2500);
    }

    function clearHintHighlights() {
        document.querySelectorAll('.hint-source, .hint-target').forEach(el => el.classList.remove('hint-source', 'hint-target'));
    }

    /** 從初始盤面重放前 n 步（撤銷＝少放一步），不需要為每一步留一份盤面快照。 */
    function rebuildFromMoves(keep) {
        let state = deepClone(tubesSnapshot);
        for (let i = 0; i < keep; i++) {
            const [from, to] = movesApplied[i];
            state = Core.applyMove(state, from, to);
        }
        return state;
    }

    function undoMove() {
        if (movesApplied.length === 0 || isGameOver) return;
        if (!assistOn && undoLeft <= 0) {
            $('message').textContent = '撤銷次數用完（可在首頁開啟輔助模式）';
            triggerShake(selectedTubeIndex === null ? 0 : selectedTubeIndex);
            return;
        }
        SFX.deselect();
        movesApplied.pop();
        if (!assistOn) undoLeft--;
        tubes = rebuildFromMoves(movesApplied.length);
        selectedTubeIndex = null;
        moveCount = Math.max(0, moveCount - 1);
        clearHintHighlights();
        hintActive = false;
        $('moves-display').textContent = moveCount + ' 步';
        $('undo-btn').disabled = movesApplied.length === 0;
        updateUndoLabel();
        $('message').textContent = '';
        renderBoard();
        updateProgress();
        saveProgress();
    }

    function checkWinCondition() {
        if (!Core.isSolved(tubes)) return false;
        isGameOver = true;
        clearInterval(timerInterval);
        clearProgress();
        const numDone = countCompleted();
        if (numDone === currentDifficulty) SFX.win();
        else SFX.complete();
        saveDaily();
        const isNewRecord = saveBestScore();
        setTimeout(() => {
            const overlay = $('win-overlay'), statsEl = $('win-stats'), subEl = $('win-subtitle');
            const fmt = t => Math.floor(t / 60).toString().padStart(2, '0') + ':' + (t % 60).toString().padStart(2, '0');
            const stars = Core.starsFor(moveCount, parSteps);
            const starText = parSteps ? ' ' + '⭐'.repeat(stars) + '☆'.repeat(3 - stars) : '';
            const parText = parSteps ? `（最佳 ${parSteps} 步${parOptimal ? '' : '＊'}）` : '';
            if (gameMode === 'stopwatch') {
                statsEl.textContent = fmt(currentTime) + '  ·  ' + moveCount + ' 步' + parText + starText;
                subEl.textContent = '完美地完成了所有分類！';
            } else if (gameMode === 'countdown') {
                statsEl.textContent = '剩餘 ' + fmt(currentTime) + '  ·  ' + moveCount + ' 步' + parText + starText;
                subEl.textContent = '在時限內完成，太厲害了！';
            } else {
                statsEl.textContent = moveCount + ' 步完成' + parText + starText;
                subEl.textContent = '悠閒地完成了所有分類';
            }
            if (isNewRecord) subEl.textContent = '🏆 新紀錄！' + subEl.textContent;
            overlay.classList.add('show');
            triggerWinAnimation();
        }, 300);
        return true;
    }

    function triggerWinAnimation() {
        if (reduceMotion.matches) return;   // 尊重系統設定：不灑彩帶
        const colors = ['#4f8ef7', '#c471ed', '#0be881', '#f7c948', '#ff4560', '#fff'];
        for (let i = 0; i < 70; i++) {
            setTimeout(() => {
                const c = document.createElement('div');
                c.className = 'confetti';
                c.style.left = Math.random() * 100 + 'vw';
                c.style.top = '-15px';
                c.style.background = colors[Math.floor(Math.random() * colors.length)];
                c.style.width = (6 + Math.random() * 8) + 'px';
                c.style.height = (8 + Math.random() * 10) + 'px';
                c.style.animationDuration = (1.5 + Math.random() * 2) + 's';
                c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                document.body.appendChild(c);
                setTimeout(() => c.remove(), 4000);
            }, i * 40);
        }
    }

    // 以時間戳計算經過秒數：setInterval 只負責「多久更新一次畫面」，
    // 因此漂移、分頁被節流都不會讓計時失準（回來時會一次補上正確秒數）
    function restartClock() {
        clockStartAt = (typeof performance !== 'undefined' ? performance.now() : Date.now());
        clockBase = currentTime;
    }

    function elapsedSeconds() {
        const now = (typeof performance !== 'undefined' ? performance.now() : Date.now());
        return Math.floor((now - clockStartAt) / 1000);
    }

    function tickTimer() {
        if (isGameOver) return;
        const elapsed = elapsedSeconds();
        const prev = currentTime;
        if (gameMode === 'countdown') {
            currentTime = Math.max(0, clockBase - elapsed);
            if (currentTime <= 10 && currentTime > 0 && currentTime !== prev) SFX.tick();
            if (currentTime <= 0) { isGameOver = true; clearInterval(timerInterval); updateTimerDisplay(); $('lose-overlay').classList.add('show'); SFX.error(); return; }
        } else {
            currentTime = clockBase + elapsed;
        }
        updateTimerDisplay();
        const el = $('timer-display');
        if (gameMode === 'countdown' && currentTime <= 15) el.classList.add('danger');
        else el.classList.remove('danger');
    }

    function updateTimerDisplay() {
        if (gameMode === 'normal') return;
        const m = Math.floor(currentTime / 60).toString().padStart(2, '0');
        const s = (currentTime % 60).toString().padStart(2, '0');
        $('timer-display').textContent = m + ':' + s;
    }

    function saveBestScore() {
        const best = loadBest();
        const key = currentDifficulty + '_' + gameMode;
        const entry = best[key] || {};
        let isNewRecord = false;

        if (gameMode === 'stopwatch') {
            if (entry.time === undefined || currentTime < entry.time) { entry.time = currentTime; isNewRecord = true; }
        } else if (gameMode === 'countdown') {
            if (entry.time === undefined || currentTime > entry.time) { entry.time = currentTime; isNewRecord = true; }
        }
        // 步數與星等三種模式都記（輕鬆模式沒有時間，步數就是唯一的成績）
        if (entry.moves === undefined || moveCount < entry.moves) { entry.moves = moveCount; isNewRecord = true; }
        if (parSteps) entry.par = parSteps;
        entry.stars = Math.max(entry.stars || 0, Core.starsFor(moveCount, parSteps));
        entry.ts = Date.now();
        best[key] = entry;

        try { localStorage.setItem(LS_KEYS.bestV2, JSON.stringify(best)); } catch (err) { /* 忽略 */ }
        renderBestScores();
        return isNewRecord;
    }

    function renderBestScores() {
        const best = loadBest(), el = $('best-scores');
        el.innerHTML = '';
        const diffNames = DIFF_NAMES;
        const modes = [{ k: 'stopwatch', n: '⏱ 計時' }, { k: 'countdown', n: '⏳ 限時' }, { k: 'normal', n: '☕ 輕鬆' }];
        const diffs = [6, 8, 10, 12];
        diffs.forEach(d => {
            modes.forEach(m => {
                const key = d + '_' + m.k, entry = best[key];
                if (entry !== undefined) {
                    const div = document.createElement('div');
                    div.style.cssText = 'background:var(--glass);border:1px solid var(--glass-b);border-radius:8px;padding:6px 12px;font-size:0.78rem;display:flex;justify-content:space-between;align-items:center;gap:8px;';
                    const fmt = fmtTime;
                    const left = diffNames[d] + ' ' + m.n;
                    const time = entry.time !== undefined ? (m.k === 'countdown' ? '剩' + fmt(entry.time) : fmt(entry.time)) : '';
                    const moves = entry.moves !== undefined ? entry.moves + ' 步' : '';
                    const stars = entry.stars ? '⭐'.repeat(entry.stars) : '';
                    div.innerHTML = '<span style="color:var(--text-dim)">' + left + '</span>'
                        + '<span style="color:var(--gold);font-family:monospace;font-weight:bold">'
                        + [time, moves, stars].filter(Boolean).join(' · ') + '</span>';
                    el.appendChild(div);
                }
            });
        });
        if (!el.children.length) {
            el.innerHTML = '<div style="color:var(--text-dim);font-size:0.78rem;text-align:center;padding:6px">尚無記錄，加油！</div>';
        }
    }

    function startGame(mode, restore) {
        SFX.click();
        gameMode = mode;
        $('home-screen').style.display = 'none';
        $('game-screen').style.display = 'flex';
        $('win-overlay').classList.remove('show');
        $('lose-overlay').classList.remove('show');

        if (restore && Array.isArray(restore.snapshot)) {
            // 續玩：從初始盤面重放已走的步數（存檔只存步數日誌，不存每一步的盤面）
            tubesSnapshot = Core.clone(restore.snapshot);
            movesApplied = restore.moves.map((m) => [m[0], m[1]]);
            tubes = rebuildFromMoves(movesApplied.length);
            moveCount = movesApplied.length;
            dailyMode = !!restore.daily; dailyKey = restore.dailyKey || '';
            lockedTube = typeof restore.lockedTube === 'number' ? restore.lockedTube : -1;
            lockUntil = Date.now() + (typeof restore.lockRemainMs === 'number' ? restore.lockRemainMs : 0);
            if (lockedTube >= 0) scheduleUnlock();
            peekLeft = typeof restore.peekLeft === 'number' ? restore.peekLeft : PEEK_PER_GAME;
            rewardGiven = typeof restore.rewardGiven === 'number' ? restore.rewardGiven : 0;
        } else if (pendingLevel) {
            tubes = Core.clone(pendingLevel);
            tubesSnapshot = deepClone(tubes);
            movesApplied = [];
            moveCount = 0;
            pendingLevel = null;
        } else {
            tubes = generateRandomLevel(currentDifficulty);
            tubesSnapshot = deepClone(tubes);
            movesApplied = [];
            moveCount = 0;
            dailyMode = false; dailyKey = '';
            lastHiddenCount = [];
        }
        // 地獄模式（12 色）開局上鎖一管：只能倒出、不能倒入，8 秒後自動解鎖。
        // 為什麼不是「整管凍結」：那等於把該管的顏色移出遊戲，12 色盤面常常直接無解
        // （實測照合法步走 300 步仍無法完成任何一管）。只鎖「倒入」方向時，管內的水仍然
        // 可以流出，而且解鎖用真實時間而不是步數 —— 玩家永遠等得到，不會死局。
        lockedTube = -1; lockUntil = 0;
        clearTimeout(lockTimer); lockTimer = null;
        if (!restore && currentDifficulty >= 12) {
            const candidates = tubes.map((t, i) => (t.length >= 2 ? i : -1)).filter((i) => i >= 0);
            if (candidates.length) {
                lockedTube = candidates[Math.floor(Math.random() * candidates.length)];
                lockUntil = Date.now() + LOCK_MS;
                scheduleUnlock();
            }
        }
        peekLeft = PEEK_PER_GAME; peekUntil = 0; rewardGiven = 0;
        prevCompleted = countCompleted(); lastHiddenCount = [];
        updatePeekLabel();
        selectedTubeIndex = null;
        isGameOver = false;
        isAnimating = false;
        hintActive = false;
        clearHintHighlights();
        $('message').textContent = '';
        $('message').style.color = '';
        $('moves-display').textContent = moveCount + ' 步';
        clearInterval(timerInterval);
        currentTime = restore && typeof restore.currentTime === 'number'
            ? (gameMode === 'countdown' ? Math.max(0, restore.currentTime) : restore.currentTime)
            : (gameMode === 'countdown' ? COUNTDOWN_SECONDS : 0);
        restartClock();
        updateTimerDisplay();
        if (gameMode !== 'normal') timerInterval = setInterval(tickTimer, 250);
        else $('timer-display').textContent = '∞';
        $('timer-display').classList.remove('danger');
        $('undo-btn').disabled = movesApplied.length === 0;
        resetAssistCounters();
        renderBoard();
        updateProgress();
        computePar();
    }

    function nextGame() {
        $('win-overlay').classList.remove('show');
        document.querySelectorAll('.confetti').forEach(e => e.remove());
        startGame(gameMode);
    }

    function backToHome() {
        SFX.click();
        saveProgress();
        refreshResumeButton();
        clearInterval(timerInterval);
        $('game-screen').style.display = 'none';
        $('home-screen').style.display = 'flex';
        $('win-overlay').classList.remove('show');
        $('lose-overlay').classList.remove('show');
        document.querySelectorAll('.confetti').forEach(e => e.remove());
        renderBestScores();
    }

    function resetCurrentGame() {
        SFX.click();
        clearProgress();
        document.querySelectorAll('.confetti').forEach(e => e.remove());
        $('win-overlay').classList.remove('show');
        $('lose-overlay').classList.remove('show');
        tubes = deepClone(tubesSnapshot);
        movesApplied = [];
        selectedTubeIndex = null;
        isGameOver = false;
        isAnimating = false;
        moveCount = 0;
        lastHiddenCount = []; prevCompleted = 0;
        hintActive = false;
        clearHintHighlights();
        $('message').textContent = '';
        $('undo-btn').disabled = true;
        $('moves-display').textContent = '0 步';
        clearInterval(timerInterval);
        currentTime = gameMode === 'countdown' ? COUNTDOWN_SECONDS : 0;
        restartClock();
        updateTimerDisplay();
        if (gameMode !== 'normal') timerInterval = setInterval(tickTimer, 250);
        else $('timer-display').textContent = '∞';
        $('timer-display').classList.remove('danger');
        resetAssistCounters();
        renderBoard();
        updateProgress();
        computePar();
    }

    function bindBoardEvents() {
        const board = $('game-board');
        const indexFromEvent = (e) => {
            const el = e.target.closest ? e.target.closest('.tube') : null;
            return el ? Number(el.dataset.index) : -1;
        };
        board.addEventListener('click', (e) => {
            const idx = indexFromEvent(e);
            if (idx >= 0) handleTubeClick(idx);
        });
        board.addEventListener('keydown', (e) => {
            if (e.key !== 'Enter' && e.key !== ' ') return;
            const idx = indexFromEvent(e);
            if (idx < 0) return;
            e.preventDefault();          // 避免空白鍵把頁面往下捲
            handleTubeClick(idx);
        });
    }

    /* ── 續玩存檔（重整或誤關分頁不再整局白費） ── */
    const MODE_NAMES = { stopwatch: '⏱ 計時', countdown: '⏳ 限時', normal: '☕ 輕鬆' };
    const DIFF_NAMES = { 6: '簡單', 8: '中等', 10: '困難', 12: '地獄' };
    const fmtTime = (t) => Math.floor(t / 60).toString().padStart(2, '0') + ':' + (t % 60).toString().padStart(2, '0');

    function saveProgress() {
        if (isGameOver || movesApplied.length === 0) return;
        try {
            localStorage.setItem(LS_KEYS.save, JSON.stringify({
                v: 1, mode: gameMode, difficulty: currentDifficulty, daily: dailyMode, dailyKey,
                lockedTube, lockRemainMs: Math.max(0, lockUntil - Date.now()), peekLeft, rewardGiven,
                snapshot: tubesSnapshot, moves: movesApplied, currentTime, ts: Date.now(),
            }));
        } catch (err) { /* 無痕模式寫不進去就算了 */ }
    }

    function clearProgress() {
        try { localStorage.removeItem(LS_KEYS.save); } catch (err) { /* 忽略 */ }
        refreshResumeButton();
    }

    function loadProgress() {
        try {
            const raw = JSON.parse(localStorage.getItem(LS_KEYS.save) || 'null');
            if (!raw || raw.v !== 1 || !Array.isArray(raw.snapshot) || !Array.isArray(raw.moves)) return null;
            // 存檔要能重放；壞掉的存檔直接丟掉，不要讓玩家卡在壞盤面
            let state = Core.clone(raw.snapshot);
            for (const mv of raw.moves) {
                if (!Array.isArray(mv) || !Core.canPour(state, mv[0], mv[1])) return null;
                state = Core.applyMove(state, mv[0], mv[1]);
            }
            if (Core.isSolved(state)) return null;
            return raw;
        } catch (err) { return null; }
    }

    function refreshResumeButton() {
        const btn = $('resume-btn');
        if (!btn) return;
        const saved = loadProgress();
        if (!saved) { btn.style.display = 'none'; return; }
        btn.style.display = 'flex';
        $('resume-desc').textContent =
            `${saved.daily ? '📅 每日 · ' : ''}${DIFF_NAMES[saved.difficulty] || saved.difficulty}`
            + ` · ${MODE_NAMES[saved.mode] || saved.mode} · ${saved.moves.length} 步 · ${fmtTime(saved.currentTime)}`;
    }

    /* ── 每日挑戰：以日期為種子，全球同一題 ── */
    function loadDaily() {
        try { return JSON.parse(localStorage.getItem(LS_KEYS.daily) || '{}') || {}; } catch (err) { return {}; }
    }

    function refreshDailyButton() {
        const rec = loadDaily()[Core.todayKey()];
        const desc = $('daily-desc');
        if (!desc) return;
        desc.textContent = rec
            ? `今天已完成：${rec.moves} 步${rec.stars ? ' ' + '⭐'.repeat(rec.stars) : ''}`
            : `每天同一題，${DIFF_NAMES[DAILY_DIFFICULTY]}（${DAILY_DIFFICULTY} 色）`;
    }

    function startDaily() {
        const key = Core.todayKey();
        const level = Core.generateLevel(DAILY_DIFFICULTY, Core.mulberry32(Core.dailySeed(key, DAILY_DIFFICULTY)));
        dailyMode = true; dailyKey = key; pendingLevel = level;
        startGame('stopwatch');
    }

    function saveDaily() {
        if (!dailyMode || !dailyKey) return;
        const all = loadDaily();
        const prev = all[dailyKey];
        const stars = Core.starsFor(moveCount, parSteps);
        if (!prev || moveCount < prev.moves) all[dailyKey] = { moves: moveCount, time: currentTime, stars };
        try { localStorage.setItem(LS_KEYS.daily, JSON.stringify(all)); } catch (err) { /* 忽略 */ }
        refreshDailyButton();
    }

    /* ── 透視：3 秒內顯示所有顏色（每局 1 次） ── */
    function usePeek() {
        if (peekLeft <= 0) { $('message').textContent = '透視已經用過了（每局 1 次）'; return; }
        if (isGameOver || isAnimating) return;
        peekLeft--;
        peekUntil = Date.now() + PEEK_MS;
        SFX.select();
        renderBoard();
        $('message').textContent = '🔍 透視中…3 秒';
        updatePeekLabel();
        setTimeout(() => { peekUntil = 0; renderBoard(); }, PEEK_MS + 20);
    }

    function updatePeekLabel() {
        const btn = $('peek-btn');
        if (btn) btn.textContent = `🔍 透視 ${peekLeft}`;
    }

    /* ── 分享成績 ── */
    function shareText() {
        const stars = Core.starsFor(moveCount, parSteps);
        const head = dailyMode
            ? `水瓶分類 · 每日挑戰 ${dailyKey}（${DAILY_DIFFICULTY} 色）`
            : `水瓶分類 · ${DIFF_NAMES[currentDifficulty]}（${currentDifficulty} 色）· ${MODE_NAMES[gameMode]}`;
        const time = gameMode === 'normal' ? '' : ` · ${fmtTime(currentTime)}`;
        return `${head}\n${moveCount} 步${time}${parSteps ? `（最佳 ${parSteps} 步）` : ''} ${'⭐'.repeat(stars)}${'☆'.repeat(3 - stars)}\nhttps://cormort.github.io/sorting-water/`;
    }

    async function shareScore() {
        const text = shareText();
        try {
            if (navigator.share) await navigator.share({ text });
            else if (navigator.clipboard) { await navigator.clipboard.writeText(text); $('message').textContent = '📋 成績已複製到剪貼簿'; }
            else throw new Error('no clipboard');
        } catch (err) {
            // 使用者取消分享不算錯誤；真的沒有 API 時退回提示
            if (err && err.name === 'AbortError') return;
            $('message').textContent = '（此瀏覽器不支援複製，請手動截圖）';
        }
    }

    function resumeGame() {
        const saved = loadProgress();
        if (!saved) { refreshResumeButton(); return; }
        currentDifficulty = saved.difficulty;
        document.querySelectorAll('.diff-pill[data-diff]').forEach((p) => {
            p.classList.toggle('active', parseInt(p.dataset.diff, 10) === currentDifficulty);
        });
        startGame(saved.mode, saved);
    }

    /* ── 步數星等：用求解器算最佳步數（放在閒置時間算，不擋畫面） ── */
    function computePar() {
        parSteps = 0; parOptimal = false;
        $('par-display').textContent = '最佳 …';
        const run = () => {
            const res = Core.solveOptimal(deepClone(tubesSnapshot), { maxNodes: 120000 });
            parSteps = res.moves ? res.moves.length : 0;
            parOptimal = res.optimal;
            updateParLabel();
        };
        if (window.requestIdleCallback) window.requestIdleCallback(run, { timeout: 1200 });
        else setTimeout(run, 150);
    }

    function updateParLabel() {
        const el = $('par-display');
        if (!el) return;
        el.textContent = parSteps ? `最佳 ${parSteps} 步${parOptimal ? '' : '＊'}` : '最佳 –';
        el.title = parOptimal ? '求解器算出的最短步數' : '求解器預算內的最佳解（此難度為近似值）';
    }

    /* ── 色盲符號模式：可見色塊加上形狀，顏色不再是唯一資訊 ── */
    function applySymbols() {
        const board = $('game-board');
        if (board) board.classList.toggle('symbols', symbolsOn);
        const pill = $('symbols-pill');
        if (pill) pill.classList.toggle('active', symbolsOn);
    }

    function toggleSymbols() {
        symbolsOn = !symbolsOn;
        try { localStorage.setItem(LS_KEYS.symbols, symbolsOn ? '1' : '0'); } catch (err) { /* 忽略 */ }
        applySymbols();
        SFX.click();
    }

    /* ── 輔助模式 vs 挑戰模式（挑戰：提示 3 次、撤銷 5 次） ── */
    const CHALLENGE_HINTS = 3, CHALLENGE_UNDOS = 5;
    let hintLeft = Infinity, undoLeft = Infinity;

    function resetAssistCounters() {
        hintLeft = assistOn ? Infinity : CHALLENGE_HINTS;
        undoLeft = assistOn ? Infinity : CHALLENGE_UNDOS;
        updateAssistLabels();
    }

    function updateAssistLabels() {
        const pill = $('assist-pill');
        if (pill) {
            pill.classList.toggle('active', assistOn);
            pill.querySelector('.diff-label').innerHTML = assistOn ? '輔助<br>全開' : '挑戰<br>模式';
        }
        const hintBtn = $('hint-btn'), undoBtn = $('undo-btn');
        if (hintBtn) hintBtn.textContent = assistOn ? '💡 提示' : `💡 提示 ${hintLeft}`;
        updateUndoLabel();
    }

    function updateUndoLabel() {
        const undoBtn = $('undo-btn');
        if (!undoBtn) return;
        undoBtn.textContent = assistOn ? '↩ 撤銷' : `↩ 撤銷 ${undoLeft}`;
    }

    function toggleAssist() {
        assistOn = !assistOn;
        try { localStorage.setItem(LS_KEYS.assist, assistOn ? '1' : '0'); } catch (err) { /* 忽略 */ }
        resetAssistCounters();
        SFX.click();
    }

    /* ── 最佳成績 v2：時間 + 步數 + 星等（舊版數字自動遷移） ── */
    function loadBest() {
        let best = {};
        try { best = JSON.parse(localStorage.getItem(LS_KEYS.bestV2) || '{}') || {}; } catch (err) { best = {}; }
        try {
            const legacy = JSON.parse(localStorage.getItem(LS_KEYS.best) || '{}') || {};
            for (const [key, val] of Object.entries(legacy)) {
                if (typeof val === 'number' && !best[key]) best[key] = { time: val };
            }
        } catch (err) { /* 舊資料壞掉就忽略 */ }
        return best;
    }

    function init() {
        const params = new URLSearchParams(location.search);
        isMuted = localStorage.getItem(LS_KEYS.mute) === 'true';
        if (params.has('mute')) { isMuted = true; musicOn = false; }   // CI／自動化用
        const savedDiff = parseInt(localStorage.getItem(LS_KEYS.diff));
        currentDifficulty = savedDiff || 6;

        const btn = $('mute-btn');
        btn.textContent = isMuted ? '🔇 靜音' : '🔊 音效';
        btn.style.color = isMuted ? 'var(--danger)' : '';
        btn.addEventListener('click', toggleMute);

        musicOn = localStorage.getItem(LS_KEYS.music) !== 'false';
        const mbtn = $('music-btn');
        mbtn.textContent = musicOn ? '🎵 音樂' : '🎵 關閉';
        mbtn.style.color = musicOn ? '' : 'var(--danger)';
        mbtn.addEventListener('click', toggleMusic);

        // 只挑難度 pill：設定列（色盲／輔助）也是 .diff-pill，但沒有 data-diff，
        // 若一起綁「currentDifficulty = parseInt(dataset.diff)」會變成 NaN
        document.querySelectorAll('.diff-pill[data-diff]').forEach(p => {
            if (parseInt(p.dataset.diff, 10) === currentDifficulty) p.classList.add('active');
            else p.classList.remove('active');
            p.addEventListener('click', () => {
                document.querySelectorAll('.diff-pill[data-diff]').forEach(pp => pp.classList.remove('active'));
                p.classList.add('active');
                currentDifficulty = parseInt(p.dataset.diff);
                localStorage.setItem(LS_KEYS.diff, currentDifficulty);
                SFX.click();
            });
        });

        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', () => startGame(btn.dataset.mode));
        });

        bindBoardEvents();
        // 續玩存檔：重整或誤關分頁後可以在首頁接續
        $('resume-btn').addEventListener('click', resumeGame);
        refreshResumeButton();
        // 重整／切到背景時也存一次（最後一步之後才關掉分頁的情況）
        window.addEventListener('pagehide', saveProgress);
        document.addEventListener('visibilitychange', () => { if (document.hidden) saveProgress(); });

        // 色盲符號與輔助模式（設定存 localStorage）
        symbolsOn = localStorage.getItem(LS_KEYS.symbols) === '1';
        $('symbols-pill').addEventListener('click', toggleSymbols);
        assistOn = localStorage.getItem(LS_KEYS.assist) !== '0';
        $('assist-pill').addEventListener('click', toggleAssist);
        applySymbols();
        resetAssistCounters();

        $('daily-btn').addEventListener('click', startDaily);
        $('peek-btn').addEventListener('click', usePeek);
        $('share-btn').addEventListener('click', shareScore);
        refreshDailyButton();
        $('undo-btn').addEventListener('click', undoMove);
        $('hint-btn').addEventListener('click', showHint);
        $('reset-btn').addEventListener('click', resetCurrentGame);
        $('home-btn').addEventListener('click', backToHome);
        $('next-btn').addEventListener('click', nextGame);
        $('win-home-btn').addEventListener('click', backToHome);
        $('retry-btn').addEventListener('click', () => { $('lose-overlay').classList.remove('show'); resetCurrentGame(); });
        $('lose-home-btn').addEventListener('click', backToHome);

        renderBestScores();

        // 除錯鉤子：只在 ?bot 時掛出（驗證工具用來讀狀態、算解法、模擬點擊）
        if (params.has('bot')) {
            window.__sorting = {
                getTubes: () => deepClone(tubes),
                getState: () => ({ gameMode, currentDifficulty, isGameOver, isAnimating, moveCount, selectedTubeIndex, currentTime, hintActive }),
                getSolution: (maxNodes) => Core.solve(tubes, { maxNodes: maxNodes || 200000 }).moves,
                isSolvable: () => Core.isSolvable(tubes, { maxNodes: 200000 }),
                click: (i) => handleTubeClick(i),
                start: (mode) => startGame(mode),
                reset: () => resetCurrentGame(),
                hint: () => showHint(),
                undo: () => undoMove(),
                goHome: () => backToHome(),
                // P0：續玩存檔／色盲符號／步數星等／輔助模式
                save: () => saveProgress(),
                loadSave: () => loadProgress(),
                clearSave: () => clearProgress(),
                resume: () => resumeGame(),
                hasResume: () => $('resume-btn').style.display !== 'none',
                getPar: () => ({ par: parSteps, optimal: parOptimal }),
                waitPar: () => new Promise((resolve) => {
                    const t0 = Date.now();
                    const check = () => {
                        if (parSteps > 0 || Date.now() - t0 > 4000) resolve({ par: parSteps, optimal: parOptimal });
                        else setTimeout(check, 50);
                    };
                    check();
                }),
                toggleSymbols: () => toggleSymbols(),
                symbolsOn: () => symbolsOn,
                assistOn: () => assistOn,
                toggleAssist: () => toggleAssist(),
                counters: () => ({ hintLeft, undoLeft }),
                cancelHint: () => { clearHintHighlights(); hintActive = false; },
                best: () => loadBest(),
                symbols: Core.COLOR_SYMBOLS,
                // P1：每日挑戰／透視／凍結／獎勵空管／分享
                startDaily: () => startDaily(),
                dailyRecord: () => loadDaily()[Core.todayKey()] || null,
                todayKey: () => Core.todayKey(),
                peek: () => usePeek(),
                peekState: () => ({ peekLeft, revealing: Date.now() < peekUntil }),
                lockedTube: () => lockedTube,
                lockRemainMs: () => Math.max(0, lockUntil - Date.now()),
                unlockNow: () => unlockTube('（測試）'),
                pourInfo: () => lastPourInfo,
                setTubes: (t) => { tubes = Core.clone(t); tubesSnapshot = Core.clone(t); movesApplied = []; lastPourInfo = null; renderBoard(); updateProgress(); },
                sfxPour: (drops, level) => SFX.pour(drops, level),
                canPour: (f, t) => canPour(f, t),
                legalMoves: () => Core.getValidMoves(tubes).map(([f, t, n, srcLen]) => [f, t]),
                rewardState: () => ({ rewardGiven }),
                shareText: () => shareText(),
                core: Core,
                isReducedMotion: () => reduceMotion.matches,
            };
        }
    }

    init();
})();
</script>
</body>
</html>
